nessie.version.store.type=ROCKSDB
nessie.version.store.persist.rocks.database-path=/nessie/data
nessie.catalog.default-warehouse=warehouse
nessie.catalog.warehouses.warehouse.location=s3://iceberg/nessie-warehouse
nessie.catalog.service.s3.default-options.endpoint=http://rustfs:9000
nessie.catalog.service.s3.default-options.path-style-access=true
nessie.catalog.service.s3.default-options.region=${S3_REGION:us-east-1}
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:s3-default
s3-default.name=${S3_ACCESS_KEY}
s3-default.secret=${S3_SECRET_KEY}
