name: prefect-lakehouse

x-app: &app
  build: .
  image: prefect-lakehouse-worker:local
  env_file: .env
  environment: &app-env
    S3_ENDPOINT: rustfs:9000
    ICEBERG_CATALOG_ENDPOINT: http://polaris:8181/api/catalog
    PREFECT_API_URL: http://prefect-server:4200/api
    DUCKDB_TEMP_DIRECTORY: /tmp/duckdb
  volumes:
    - ./.prefect/runtime:/runtime

x-polaris-env: &polaris-env
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
  QUARKUS_DATASOURCE_USERNAME: polaris
  QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?Configure POLARIS_DB_PASSWORD}

services:
  trino:
    image: trinodb/trino:484
    restart: unless-stopped
    mem_limit: ${TRINO_MEMORY:-576m}
    ports:
      - '127.0.0.1:${TRINO_PORT:-8080}:8443'
    environment:
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./.prefect/runtime/trino:/etc/trino:ro
      - ./.prefect/runtime/reader.env:/runtime/reader.env:ro
      - ./infra/trino-start.sh:/opt/trino-start.sh:ro
    entrypoint: ['/bin/bash', '/opt/trino-start.sh']
    depends_on:
      lakehouse-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fkSs', 'https://localhost:8443/v1/info']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    mem_limit: ${RUSTFS_MEMORY:-192m}
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Configure RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Configure RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  polaris-db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY:-80m}
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD:?Configure POLARIS_DB_PASSWORD}
    command: ['postgres', '-c', 'shared_buffers=16MB', '-c', 'max_connections=20', '-c', 'work_mem=1MB']
    volumes:
      - polaris-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polaris -d polaris']
      interval: 5s
      timeout: 3s
      retries: 20

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    mem_limit: ${POLARIS_MEMORY:-320m}
    environment:
      <<: *polaris-env
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:ActiveProcessorCount=1
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:?Configure POLARIS_ROOT_CLIENT_SECRET}
    depends_on:
      polaris-db:
        condition: service_healthy

  polaris:
    image: apache/polaris:1.8.0
    restart: unless-stopped
    mem_limit: ${POLARIS_MEMORY:-320m}
    ports:
      - '127.0.0.1:${POLARIS_PORT:-8181}:8181'
    environment:
      <<: *polaris-env
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: 'true'
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:ActiveProcessorCount=1
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8182/q/health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  lakehouse-setup:
    <<: *app
    restart: 'no'
    mem_limit: 192m
    command: ['python', '-m', 'infra.bootstrap']
    depends_on:
      polaris:
        condition: service_healthy

  prefect-server:
    <<: *app
    profiles: [processing]
    mem_limit: ${PREFECT_SERVER_MEMORY:-160m}
    ports:
      - '127.0.0.1:${PREFECT_PORT:-4200}:4200'
    command: ['prefect', 'server', 'start', '--host', '0.0.0.0', '--port', '4200']
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30

  prefect-worker:
    <<: *app
    profiles: [processing]
    mem_limit: ${PREFECT_WORKER_MEMORY:-384m}
    environment:
      <<: *app-env
      POLARIS_CREDENTIALS_FILE: /runtime/writer.env
    command:
      - sh
      - -ec
      - |
        prefect work-pool create local --type process --overwrite
        prefect work-pool set-concurrency-limit local 1
        prefect deploy --all
        exec prefect worker start --pool local --limit 1
    depends_on:
      prefect-server:
        condition: service_healthy
      lakehouse-setup:
        condition: service_completed_successfully

volumes:
  rustfs-data:
  polaris-db-data:
  prefect-data:
