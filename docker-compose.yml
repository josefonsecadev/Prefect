name: prefect-lakehouse

x-app: &app
  build: .
  image: prefect-lakehouse-worker:local
  environment: &app-env
    S3_ENDPOINT: rustfs:9000
    ICEBERG_CATALOG_ENDPOINT: http://nessie:19120/iceberg
    PREFECT_API_URL: http://prefect-server:4200/api
    DUCKDB_TEMP_DIRECTORY: /tmp/duckdb
  volumes:
    - ./.prefect/runtime:/runtime

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    mem_limit: ${CLICKHOUSE_MEMORY:-576m}
    ports:
      - '127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123'
      - '127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9002}:9000'
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-lakehouse_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Configure CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_READONLY_PASSWORD: ${CLICKHOUSE_READONLY_PASSWORD:?Configure CLICKHOUSE_READONLY_PASSWORD}
      CLICKHOUSE_S3_ACCESS_KEY: ${CLICKHOUSE_S3_ACCESS_KEY:?Configure CLICKHOUSE_S3_ACCESS_KEY}
      CLICKHOUSE_S3_SECRET_KEY: ${CLICKHOUSE_S3_SECRET_KEY:?Configure CLICKHOUSE_S3_SECRET_KEY}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/s3.xml:/etc/clickhouse-server/config.d/s3.xml:ro
      - ./infra/clickhouse/users.d/zz-analyst.xml:/etc/clickhouse-server/users.d/zz-analyst.xml:ro
      - ./infra/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      nessie:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --user analista --password "$${CLICKHOUSE_READONLY_PASSWORD}" --query "SELECT 1"']
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    mem_limit: ${RUSTFS_MEMORY:-192m}
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-9000}:9000'
      - '127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Configure RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Configure RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.1
    restart: unless-stopped
    mem_limit: ${NESSIE_MEMORY:-384m}
    ports:
      - '127.0.0.1:${NESSIE_PORT:-19120}:19120'
    environment:
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - nessie-data:/nessie/data
      - ./infra/nessie/application.properties:/deployments/config/application.properties:ro
    depends_on:
      nessie-data-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:19120/api/v2/config']
      interval: 10s
      timeout: 5s
      retries: 20

  nessie-data-init:
    image: ghcr.io/projectnessie/nessie:0.107.1
    user: '0:0'
    restart: 'no'
    entrypoint: ['/bin/sh', '-ec']
    command: ['mkdir -p /nessie/data && chown -R 10000:10001 /nessie/data']
    volumes:
      - nessie-data:/nessie/data

  prefect-server:
    <<: *app
    profiles: [processing]
    environment:
      <<: *app-env
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
    mem_limit: ${PREFECT_SERVER_MEMORY:-160m}
    ports:
      - '127.0.0.1:${PREFECT_PORT:-4200}:4200'
    command: ['prefect', 'server', 'start', '--host', '0.0.0.0', '--port', '4200']
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30

  prefect-worker:
    <<: *app
    profiles: [processing]
    environment:
      <<: *app-env
      AMBIENTE: ${AMBIENTE:-local}
      PIPELINE_STORAGE_FORMAT: ${PIPELINE_STORAGE_FORMAT:-iceberg}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Configure RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Configure RUSTFS_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_URL_STYLE: ${S3_URL_STYLE:-path}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-warehouse}
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-lakehouse}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-128MB}
    mem_limit: ${PREFECT_WORKER_MEMORY:-384m}
    command:
      - sh
      - -ec
      - |
        prefect work-pool create local --type process --overwrite
        prefect work-pool set-concurrency-limit local 1
        prefect deploy --all
        exec prefect worker start --pool local --limit 1
    depends_on:
      prefect-server:
        condition: service_healthy
      nessie:
        condition: service_healthy

volumes:
  rustfs-data:
  nessie-data:
  clickhouse-data:
  prefect-data:
